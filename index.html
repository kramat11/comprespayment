<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konverter Data Universal</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1300px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary); margin-bottom: 10px; font-size: 24px; }
        p { color: #64748b; font-size: 14px; }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 25px;
            margin-bottom: 20px;
        }

        .label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }

        .controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #94a3b8; color: white; }
        .btn-secondary:hover { background: #64748b; }
        .btn-copy { background: var(--success); color: white; }
        .btn-copy:hover { background: #059669; }
        
        .btn-sample { background: #e0f2fe; color: #0369a1; width: 100%; margin-top: 10px; border: 1px dashed #0ea5e9; }
        .btn-sample:hover { background: #bae6fd; }

        .status-box {
            margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; display: none;
        }
        .status-success { background: #dcfce7; color: #166534; }
        .status-error { background: #fee2e2; color: #991b1b; }

        .result-area { display: none; margin-top: 20px; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .result-actions { display: flex; gap: 10px; align-items: center; }

        .table-responsive { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
        
        th {
            background: #f1f5f9;
            text-align: left;
            padding: 12px 15px;
            border-bottom: 2px solid var(--border);
            color: #475569;
            font-weight: 700;
        }
        td { padding: 10px 15px; border-bottom: 1px solid #e2e8f0; }
        tr:hover { background-color: #f8fafc; }

        /* Helper Classes */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .bg-country { background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; }
        .text-money { font-weight: 700; color: var(--success); }
        .text-uuid { font-family: monospace; color: #94a3b8; font-size: 11px; }
        .empty-cell { color: #ccc; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <header>
    </header>

    <div class="card">
        <label class="label" for="rawInput">Input Data</label>
        <textarea id="rawInput" placeholder="Paste data Excel atau Stats di sini..."></textarea>

        <div class="controls">
            <button class="btn-primary" onclick="processData()">🔄 Konversi Data</button>
            <button class="btn-secondary" onclick="clearData()">🗑️ Bersihkan</button>
        </div>

        <div id="statusMsg" class="status-box"></div>

        <div id="resultArea" class="result-area">
            <div class="result-header">
                <div>
                    <h3>Hasil Konversi</h3>
                    <div style="font-size: 12px; color: #64748b;">Total Baris Valid (Non-Zero): <span id="rowCount">0</span></div>
                </div>
                <div class="result-actions">
                    <button class="btn-copy" onclick="copyOutput()">📋 Copy All Output</button>
                </div>
            </div>
            <div class="table-responsive">
                <table id="outputTable">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Sl Click Id</th>
                            <th>Country</th>
                            <th>Click Id</th>
                            <th>Smartlink Id</th>
                            <th>Smartlink Name</th>
                            <th>Payout In USD</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data hasil akan muncul di sini -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // --- 1. SAMPLE DATA ---
    function loadSampleStats10() {
        // Format Baru (10 Kolom - Ada metrik tambahan 0.0075, 0.0063)
        const stats = `Tracker	Hits	Uniques	Clicks	Conversions	Ratio	CTR	0.0075	0.0063	Revenue
GAJAHBARU	1772	884	1052	4	0.224305556	119.00%	0.0075	0.0063	$6.60 
jones1510	125	73	114	2	1:57	156.16%	0.074	0.0474	$5.40 
    1	1	1	0	1:∞	100.00%	0	0	$0.00 
GAJAHBARU01	7	3	7	0	1:∞	233.33%	0	0	$0.00 
ORTUSEIGHT	5	5	3	0	1:∞	60.00%	0	0	$0.00 
Total	1910	966	1177	6	0.178472222	121.84%	0	0	$12.00`;
        document.getElementById('rawInput').value = stats;
        showStatus("Contoh Data Stats (10 Kolom) dimuat.", "success");
    }

    function loadSampleStats() {
        // Format 8 Kolom (Lama)
        const stats = `Tracker	Hits	Uniques	Clicks	Conversions	Ratio	CTR	Revenue
GAJAHBARU	1772	884	1052	4	0.224305556	119.00%	$6.60 
jones1510	125	73	114	2	1:57	156.16%	$5.40`;
        document.getElementById('rawInput').value = stats;
        showStatus("Contoh Data Stats (8 Kolom) dimuat.", "success");
    }

    function loadSampleReport() {
        // Data Report Excel (Lama)
        const report = `Click Date	Conversion Date	Click ID	Country	Payout $	Status
4/26/2026 2:33	4/26/2026 2:47	GLAD2GLOW	France	3.3	200
4/26/2026 17:27	4/26/2026 17:51	GAJAHBARU	Morocco	0.03	200`;
        document.getElementById('rawInput').value = report;
        showStatus("Contoh Data Report dimuat.", "success");
    }

    // --- 2. LOGIKA UTAMA (SMART DETECTION) ---
    function processData() {
        const input = document.getElementById('rawInput').value.trim();
        const tbody = document.querySelector('#outputTable tbody');
        const statusMsg = document.getElementById('statusMsg');
        const resultArea = document.getElementById('resultArea');
        const rowCountSpan = document.getElementById('rowCount');

        tbody.innerHTML = '';
        
        if (!input) {
            showStatus("Silakan masukkan data!", "error");
            return;
        }

        const lines = input.split(/\r?\n/).filter(line => line.trim() !== '');
        const firstLine = lines[0].toLowerCase();
        
        // Cek Kata Kunci
        const isStatsMode = firstLine.includes('tracker') || firstLine.includes('revenue');
        const isReportMode = firstLine.includes('click date') || /^\d{1,2}\/\d{1,2}\/\d{4}/.test(lines[0]);

        let processedCount = 0;
        let removedCount = 0;

        if (isStatsMode) {
            // --- MODE STATS (SUPPORT BANYAK KOLOM) ---
            showStatus("Mode Terdeteksi: Stats (Auto-Scan Kolom)...", "success");
            
            let startIndex = (firstLine.includes('tracker')) ? 1 : 0; 

            for (let i = startIndex; i < lines.length; i++) {
                const line = lines[i];
                const cols = line.split('\t'); 

                if (cols.length >= 2) {
                    // AMBIL NAMA (Selalu Kolom Pertama)
                    const trackerName = cols[0].trim();

                    // AMBIL REVENUE (Scan dari belakang ke depan - Smart Scanning)
                    let revenue = "-";
                    // Loop dari index terakhir ke awal
                    for (let j = cols.length - 1; j >= 0; j--) {
                        const colContent = cols[j].trim();
                        // Cari kolom yang ada simbol $ atau USD dan ada angka
                        if ((colContent.includes('$') || colContent.includes('USD')) && colContent.match(/[\d.,]+/)) {
                            revenue = colContent;
                            break; // Ketemu, stop looping
                        }
                    }

                    // Skip baris "Total"
                    if (trackerName.toLowerCase() === 'total') continue;

                    // Validasi minimal
                    if (revenue === "-") continue;

                    // --- FILTER PAYOUT 0 ---
                    let cleanVal = revenue.replace(/[^0-9.,-]/g, '');
                    if (cleanVal.includes('.') && cleanVal.includes(',')) cleanVal = cleanVal.replace(/\./g, '').replace(',', '.');
                    else if (cleanVal.includes(',')) cleanVal = cleanVal.replace(',', '.');
                    
                    let val = parseFloat(cleanVal);
                    
                    if (val <= 0) {
                        removedCount++;
                        continue;
                    }

                    const rowData = {
                        time: "-",
                        slClickId: generateUUID(),
                        country: "-",
                        clickId: trackerName || "-",
                        smartlinkId: "-",
                        smartlinkName: trackerName || "-",
                        payout: formatPayout(revenue)
                    };
                    tbody.appendChild(createRow(rowData));
                    processedCount++;
                }
            }

        } else if (isReportMode) {
            // --- MODE REPORT EXCEL (KODE ASLI) ---
            showStatus("Mode Terdeteksi: Report Excel (Filtering $0.00)...", "success");
            
            const hasHeader = firstLine.includes('click date');
            let startIndex = hasHeader ? 1 : 0;

            for (let i = startIndex; i < lines.length; i++) {
                const line = lines[i];
                const cols = line.split('\t').map(c => c.trim());

                if (cols.length >= 5) {
                    const rawDate = cols[0];
                    const clickId = cols[2];
                    const country = cols[3];
                    const rawPayout = cols[4];
                    const statusVal = cols[5] || "-";

                    // Filter Payout 0
                    let cleanVal = rawPayout.replace(/[^0-9.,-]/g, '');
                    if (cleanVal.includes('.') && cleanVal.includes(',')) cleanVal = cleanVal.replace(/\./g, '').replace(',', '.');
                    else if (cleanVal.includes(',')) cleanVal = cleanVal.replace(',', '.');
                    
                    let val = parseFloat(cleanVal);

                    if (val <= 0) {
                        removedCount++;
                        continue;
                    }

                    // Format Time
                    let formattedTime = rawDate;
                    if (rawDate.match(/^\d{1,2}\/\d{1,2}\/\d{4}/)) {
                        const partsDate = rawDate.split(' ');
                        const datePart = partsDate[0];
                        const timePart = partsDate[1];
                        const [month, day, year] = datePart.split('/');
                        const m = month.length < 2 ? '0' + month : month;
                        const d = day.length < 2 ? '0' + day : day;
                        let t = "00:00";
                        if (timePart) {
                            const [h, min] = timePart.split(':');
                            const hh = h.length < 2 ? '0' + h : h;
                            t = hh + ":" + min;
                        }
                        formattedTime = `${d}.${m}.${year} ${t}`;
                    }

                    const rowData = {
                        time: formattedTime,
                        slClickId: generateUUID(),
                        country: country,
                        clickId: clickId,
                        smartlinkId: statusVal,
                        smartlinkName: clickId,
                        payout: formatPayout(rawPayout)
                    };
                    tbody.appendChild(createRow(rowData));
                    processedCount++;
                }
            }
        } else {
            showStatus("Format data tidak dikenali.", "error");
            return;
        }

        if (processedCount > 0) {
            rowCountSpan.textContent = processedCount;
            resultArea.style.display = 'block';
            let msg = `Berhasil: ${processedCount} baris.`;
            if (removedCount > 0) msg += ` (Dihapus ${removedCount} baris $0.00)`;
            showStatus(msg, "success");
        } else {
            resultArea.style.display = 'none';
            showStatus("Semua data bernilai $0.00 atau format salah.", "error");
        }
    }

    // --- 3. HELPER FUNCTIONS ---
    function generateUUID() { 
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    function formatPayout(str) {
        let clean = str.replace(/[^0-9.,-]/g, '');
        if (clean.includes('.') && clean.includes(',')) {
            clean = clean.replace(/\./g, '').replace(',', '.');
        } else if (clean.includes(',')) {
            clean = clean.replace(',', '.'); 
        }
        let val = parseFloat(clean);
        if (isNaN(val)) val = 0;
        let formattedNum = val.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        return formattedNum + " $";
    }

    function createRow(data) {
        const tr = document.createElement('tr');
        const timeClass = data.time === "-" ? "empty-cell" : "";
        const countryClass = data.country === "-" ? "empty-cell" : "";
        const smIdClass = data.smartlinkId === "-" ? "empty-cell" : "";

        tr.innerHTML = `
            <td class="${timeClass}">${data.time}</td>
            <td class="text-uuid">${data.slClickId}</td>
            <td><span class="badge bg-country">${data.country}</span></td>
            <td>${data.clickId}</td>
            <td class="${smIdClass}">${data.smartlinkId}</td>
            <td>${data.smartlinkName}</td>
            <td class="text-money">${data.payout}</td>
        `;
        return tr;
    }

    function copyOutput() {
        const table = document.getElementById("outputTable");
        if (!table) return;

        let rows = [];
        const headers = [];
        table.querySelectorAll("th").forEach(th => headers.push(th.innerText));
        rows.push(headers.join("\t"));

        table.querySelectorAll("tbody tr").forEach(tr => {
            const rowData = [];
            tr.querySelectorAll("td").forEach(td => rowData.push(td.innerText));
            rows.push(rowData.join("\t"));
        });

        const csvContent = rows.join("\n");

        navigator.clipboard.writeText(csvContent).then(() => {
            const originalText = document.querySelector('.btn-copy').innerHTML;
            const btn = document.querySelector('.btn-copy');
            btn.innerHTML = "✅ Copied!";
            setTimeout(() => { btn.innerHTML = originalText; }, 2000);
            showStatus("Semua data berhasil disalin!", "success");
        }).catch(err => {
            console.error('Gagal menyalin: ', err);
            showStatus("Gagal menyalin data.", "error");
        });
    }

    function showStatus(msg, type) {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.className = 'status-box status-' + type;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    function clearData() {
        document.getElementById('rawInput').value = '';
        document.getElementById('resultArea').style.display = 'none';
        document.querySelector('#outputTable tbody').innerHTML = '';
        document.getElementById('statusMsg').style.display = 'none';
    }
</script>

</body>
</html>
